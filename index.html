<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Particles</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width, height;

const floatParticles = [];
const burstParticles = [];
const FLOAT_COUNT = 140;

const BLUE_SHADES = [
  "#3b82f6",
  "#93c5fd",
  "#bfdbfe",
  "#60a5fa",
  "#2563eb",
  "#1d4ed8"
];

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;

    this.life = 0;
    this.maxLife = type === "float"
      ? 100 + Math.random() * 150
      : 50 + Math.random() * 40;

    this.size = type === "float"
      ? Math.random() * 1.5 + 0.5
      : Math.random() * 2.5 + 1;

    this.color = BLUE_SHADES[
      Math.floor(Math.random() * BLUE_SHADES.length)
    ];

    this.vx = 0;
    this.vy = 0;
    this.phase = Math.random() * Math.PI * 2;
  }

  update() {
    this.life++;

    if (this.type === "float") {
      this.y -= 0.35;
      this.x += Math.sin(this.life * 0.025 + this.phase) * 0.35;

      if (this.y < -5) {
        this.y = height + 5;
        this.x = Math.random() * width;
        this.life = 0;
      }
    } else {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.985;
      this.vy *= 0.985;
    }
  }

  draw() {
    const alpha = this.type === "burst"
      ? Math.max(0, 1 - this.life / this.maxLife)
      : 0.5 + Math.sin(this.life * 0.05 + this.phase) * 0.3;

    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.type === "burst" ? 12 : 7;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  isDead() {
    return this.life >= this.maxLife;
  }
}

// Crear las partículas flotantes
for (let i = 0; i < FLOAT_COUNT; i++) {
  const p = new Particle(
    Math.random() * width,
    Math.random() * height,
    "float"
  );

  p.life = Math.random() * p.maxLife;
  floatParticles.push(p);
}

// Crear una explosión de partículas
function spawnHeartBurst(x, y) {
  const count = 140;

  for (let i = 0; i < count; i++) {
    const p = new Particle(x, y, "burst");
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;

    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;

    burstParticles.push(p);
  }
}

// Fórmula para dibujar el corazón
function heartPoint(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t))
  };
}

const heartPoints = [];

function createHeart() {
  heartPoints.length = 0;

  // Puntos dentro de la silueta
  for (let i = 0; i < 1800; i++) {
    const t = Math.random() * Math.PI * 2;
    const edge = heartPoint(t);
    const fill = Math.sqrt(Math.random());

    heartPoints.push({
      x: edge.x * fill,
      y: edge.y * fill,
      z: (Math.random() - 0.5) * 2,
      size: Math.random() * 1.3 + 0.5,
      color: BLUE_SHADES[
        Math.floor(Math.random() * BLUE_SHADES.length)
      ],
      phase: Math.random() * Math.PI * 2
    });
  }
}

createHeart();

let angle = 0;
let tilt = -0.12;
let dragging = false;
let lastX = 0;
let lastY = 0;
let lastFrame = 0;
let elapsed = 0;
let lastBurst = -1;

function drawHeart(time) {
  const scale = Math.min(width, height) / 37;
  const cx = width / 2;
  const cy = height * 0.42;

  const points = heartPoints.map(p => {
    const xr = p.x * Math.cos(angle) - p.z * Math.sin(angle);
    const zr = p.x * Math.sin(angle) + p.z * Math.cos(angle);

    const yr = p.y * Math.cos(tilt) - zr * Math.sin(tilt);
    const zz = p.y * Math.sin(tilt) + zr * Math.cos(tilt);

    const perspective = 450 / (450 + zz * scale * 0.2);

    return {
      x: cx + xr * scale * perspective,
      y: cy + yr * scale * perspective,
      size: p.size * perspective,
      color: p.color,
      phase: p.phase,
      depth: zz
    };
  });

  points.sort((a, b) => b.depth - a.depth);

  for (const p of points) {
    const flicker =
      0.65 + 0.35 * Math.sin(time * 0.004 + p.phase);

    ctx.globalAlpha = flicker;
    ctx.fillStyle = p.color;
    ctx.shadowColor = "#3b82f6";
    ctx.shadowBlur = 7;

    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function animate(time) {
  if (!lastFrame) lastFrame = time;

  const delta = Math.min(time - lastFrame, 40);
  lastFrame = time;
  elapsed += delta;

  if (!dragging) {
    angle += delta * 0.0003;
  }

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, width, height);

  // Partículas flotantes
  for (const p of floatParticles) {
    p.update();
    p.draw();
  }

  // Explosiones
  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const p = burstParticles[i];

    p.update();
    p.draw();

    if (p.isDead()) {
      burstParticles.splice(i, 1);
    }
  }

  // Corazón visible y explosión periódica
  const cycle = Math.floor(elapsed / 7000);

  if (cycle !== lastBurst) {
    lastBurst = cycle;

    if (elapsed > 1000) {
      spawnHeartBurst(width / 2, height * 0.42);
    }
  }

  drawHeart(time);

  requestAnimationFrame(animate);
}

// Girar con el dedo o ratón
canvas.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;

  angle += (e.clientX - lastX) * 0.008;
  tilt += (e.clientY - lastY) * 0.008;

  tilt = Math.max(-1.2, Math.min(1.2, tilt));

  lastX = e.clientX;
  lastY = e.clientY;
});

function stopDragging() {
  dragging = false;
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);

requestAnimationFrame(animate);
</script>
</body>
</html>
